rubrics:
  - id: 1
    type: f2p
    text: CLI 与 Go 执行入口均可解析查询开头的具名函数声明并重复传参调用；声明不替换输入，函数体按现有分号串联语义返回最后结果，多个声明可沿非递归调用链组合调用。
  - id: 2
    type: f2p
    text: 函数读取调用方变量后，对形参和普通变量名的赋值只改变本次调用绑定；嵌套同名形参和局部变量在返回后不改变外层或宿主绑定。
  - id: 3
    type: f2p
    text: 通过形参对象或已提供的 $root 修改字段仍可在原对象观察到；函数体的 $this 及已有 $key 与当前节点和迭代一致，变量隔离不吞掉合法数据修改。
  - id: 4
    type: f2p
    text: 重复函数或形参、原生名称冲突、参数数量错误和直接或间接递归均返回明确错误，递归不会无限执行。
  - id: 5
    type: f2p
    text: 嵌套函数体发生真实求值错误后保留原错误信息并恢复调用方绑定；复用同一 Options 执行新查询时没有残留定义或局部变量，更正后的查询能正常执行。
  - id: 6
    type: p2p
    text: 无声明查询的原生及宿主注册函数、CLI --var、普通变量全局赋值和名为 def 的数据字段保持既有结果与错误语义。
  - id: 7
    type: f2p
    text: 实参在调用方当前数据上仅求值一次，函数体能组合原生及查询内函数；查询成功或失败后宿主原生函数集合均未被增加、覆盖或删除。
