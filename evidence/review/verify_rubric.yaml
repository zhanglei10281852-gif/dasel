rubrics:
  - id: 1
    type: f2p
    text: JSON 流模式在输入仍打开时输出已完整到达记录的结果，不等待下一条或 EOF；空流不执行查询也不输出 null，不支持的格式及 --it 组合在读取输入前被拒绝。
  - id: 2
    type: f2p
    text: 跨读取块和跨行的 JSON 文档及按语法分隔的标量均按完整顶层值处理，数组不会拆成多条输入记录。
  - id: 3
    type: f2p
    text: 每条记录的 $root、新建变量和 --var 内部可变对象相互隔离；记录内修改可被 --root 观察到，compact、JSON 写出选项与分支或展开结果仍按现有语义生效。
  - id: 4
    type: f2p
    text: 后续记录出现非法或截断 JSON、真实查询错误时，保留此前完整输出，报出正确的 1-based 输入序号且不执行后续查询；更正后重新调用不带入失败状态。
  - id: 5
    type: f2p
    text: 某条记录在完整序列化前发生真实 JSON 编码错误时，该条记录没有半成品输出，先前已发布记录不丢失，后续记录不执行且错误定位到输入序号。
  - id: 6
    type: f2p
    text: 处理过程不聚合整个输入流或全部输出；受控输出阻塞期间不执行后续记录查询，输出写入失败后报告错误并停止后续查询，不承诺撤回已接受字节。
  - id: 7
    type: p2p
    text: 不开启 --stream 时，普通查询的整批多文档输出、空输入默认值、既有跨格式转换和 JSON 输出选项保持原有行为。
